<!--
    ==========================================
    RECIPE SHOWCASE PAGE - RECEPE CARD.HTML
    ==========================================

    PURPOSE:
    Interactive recipe showcase website featuring 9 recipe cards with modal details popup.

    FEATURES:
    - Responsive grid layout with recipe cards
    - Hover animations and visual effects
    - Square modal popup for detailed recipe view
    - Login button linking to separate login page
    - Mobile-responsive design
    - Smooth card entrance animations

    STRUCTURE:
    - HTML5 semantic structure
    - CSS3 with gradients, animations, and responsive design
    - Vanilla JavaScript for modal functionality
    - Font Awesome icons
    - Unsplash images for recipe photos

    DEPENDENCIES:
    - Font Awesome CDN for icons
    - Unsplash API for recipe images

    AUTHOR: Recipe Showcase Application
    VERSION: 1.0
    LAST UPDATED: April 6, 2026
-->
<!DOCTYPE html>
<!-- Recipe Showcase Page - Interactive recipe cards with modal details -->
<html lang="en">
<head>
    <!-- SHARED NAVIGATION -->
    <link rel="stylesheet" href="styles/shared-nav.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Showcase - Delicious Meals</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset - Normalize browser defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles - Gradient background and layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Login Button - Positioned in top-right corner */
        .login-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .login-btn i {
            margin-right: 8px;
        }

        /* Container - Centers content and sets max width */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Section - Page title and description */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Recipe Grid - Responsive grid layout for recipe cards */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* Individual Recipe Card Styles */
        .recipe-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
        }

        .recipe-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .recipe-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .recipe-card:hover .recipe-image {
            transform: scale(1.1);
        }

        /* Recipe Card Content */
        .recipe-content {
            padding: 25px;
        }

        .recipe-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #666;
            font-size: 0.95rem;
        }

        .time-icon::before {
            content: "Time: ";
        }

        .difficulty-icon::before {
            content: "Level: ";
        }

        .recipe-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .expand-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .expand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .add-recipe-btn {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffa726, #ff7043);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            text-decoration: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            z-index: 1000;
        }

        .add-recipe-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        

        .ingredient {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            font-size: 0.95rem;
        }

        .instructions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            line-height: 1.7;
        }

        .instructions ol {
            padding-left: 20px;
            margin-top: 10px;
        }

        .instructions li {
            margin-bottom: 10px;
        }

        /* Responsive Design - Mobile optimization */
        @media (max-width: 768px) {
            .recipes-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
        }

        /* Modal Styles - Popup for recipe details */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            aspect-ratio: 1 / 1; /* Square aspect ratio */
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Modal Header - Recipe title and meta info */
        .modal-recipe-header {
            padding: 18px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .modal-recipe-title {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .modal-recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            gap: 12px;
        }

        /* Modal Body - Recipe details content */
        .modal-recipe-body {
            padding: 20px;
        }

        .modal-recipe-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.92rem;
        }

        .modal-ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-ingredient {
            background: #f8f9ff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            font-size: 0.95rem;
        }

        .modal-instructions {
            background: #f8f9ff;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            line-height: 1.6;
            max-height: 260px;
            overflow-y: auto;
        }

        .modal-instructions ol {
            padding-left: 18px;
            margin-top: 8px;
        }

        .modal-instructions li {
            margin-bottom: 12px;
        }

        .step-media {
            margin-top: 10px;
        }

        .step-media img,
        .step-media video,
        .step-media iframe {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            display: block;
        }

        .step-media iframe {
            aspect-ratio: 16 / 9;
            border: none;
        }

        .recipe-status {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.92);
            color: #4537a6;
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
            font-weight: 600;
        }

        .recipe-status.error {
            color: #b42318;
        }
    </style>
</head>
<body>
    <!-- Login Button - Links to login page -->
    <a href="LOGIN PAGE.HTML" class="login-btn">
        <i class="fas fa-sign-in-alt"></i> Login
    </a>

    <!-- Main Container -->
    <div class="container">
        <!-- Page Header -->
        <div class="header">
            <h1>Recipe Showcase</h1>
            <p>Discover amazing recipes with interactive cards</p>
        </div>

        <!-- Recipe Cards Grid -->
        <div class="recipes-grid" id="recipesGrid">
            <div class="recipe-status" id="recipeStatus">Loading recipes from TheMealDB...</div>
        </div>
    </div>

    <a href="ADD RECIPE PAGE.HTML" class="add-recipe-btn" title="Add Recipe">
        <i class="fas fa-plus"></i>
    </a>

    <!-- Modal Popup for Detailed Recipe View -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalRecipeContent"></div>
        </div>
    </div>

    <script>
        const recipes = {};
        const grid = document.getElementById('recipesGrid');
        const statusElement = document.getElementById('recipeStatus');

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function estimateDifficulty(ingredientCount) {
            if (ingredientCount >= 12) return 'Hard';
            if (ingredientCount >= 8) return 'Medium';
            return 'Easy';
        }

        function estimateTime(stepCount, ingredientCount) {
            const totalMinutes = Math.max(15, (stepCount * 7) + ingredientCount);
            return `${totalMinutes} min`;
        }

        function extractIngredients(meal) {
            const ingredients = [];

            for (let index = 1; index <= 20; index += 1) {
                const ingredient = meal[`strIngredient${index}`];
                const measure = meal[`strMeasure${index}`];

                if (!ingredient || !ingredient.trim()) {
                    continue;
                }

                ingredients.push(`${measure ? measure.trim() + ' ' : ''}${ingredient.trim()}`.trim());
            }

            return ingredients;
        }

        function splitInstructions(text, meal) {
            const blocks = (text || '')
                .replace(/\r/g, '\n')
                .split(/\n+/)
                .map(step => step.trim())
                .filter(Boolean);

            const steps = blocks.length > 1
                ? blocks
                : (text || '')
                    .split(/(?<=[.!?])\s+/)
                    .map(step => step.trim())
                    .filter(Boolean);

            return steps.map((description, index) => {
                const instruction = { description };

                if (index === 0 && meal.strYoutube) {
                    instruction.video = meal.strYoutube;
                }

                return instruction;
            });
        }

        function normalizeMealDbRecipe(meal, index) {
            const ingredients = extractIngredients(meal);
            const instructions = splitInstructions(meal.strInstructions, meal);
            const tags = [meal.strCategory, meal.strArea, ...(meal.strTags ? meal.strTags.split(',') : [])]
                .map(tag => tag && tag.trim())
                .filter(Boolean)
                .slice(0, 6);
            const description = meal.strInstructions
                ? `${meal.strInstructions.trim().slice(0, 140)}${meal.strInstructions.trim().length > 140 ? '...' : ''}`
                : 'Recipe details from TheMealDB.';

            return {
                key: `mealDbRecipe${index + 1}`,
                title: meal.strMeal,
                time: estimateTime(instructions.length || 3, ingredients.length || 5),
                difficulty: estimateDifficulty(ingredients.length),
                description,
                tags,
                ingredients,
                instructions,
                image: meal.strMealThumb,
                source: meal.strSource || ''
            };
        }

        function animateCard(card, index) {
            card.style.opacity = '0';
            card.style.transform = 'translateY(50px)';

            setTimeout(() => {
                card.style.transition = 'all 0.6s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 120);
        }

        function addRecipeCard(recipe) {
            recipes[recipe.key] = recipe;

            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.setAttribute('onclick', `toggleDetails('${recipe.key}')`);
            card.innerHTML = `
                <img src="${escapeHtml(recipe.image || 'https://images.unsplash.com/photo-1512428559087-560fa5ceab42?auto=format&fit=crop&w=1000&q=80')}"
                     alt="${escapeHtml(recipe.title)}" class="recipe-image">
                <div class="recipe-content">
                    <h3 class="recipe-title">${escapeHtml(recipe.title)}</h3>
                    <div class="recipe-meta">
                        <span class="time-icon">${escapeHtml(recipe.time || 'N/A')}</span>
                        <span class="difficulty-icon">${escapeHtml(recipe.difficulty || 'Medium')}</span>
                    </div>
                    <p class="recipe-description">${escapeHtml(recipe.description || 'Recipe details available in the modal.')}</p>
                    <div class="recipe-tags">
                        ${(recipe.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <button class="expand-btn" type="button"><i class="fas fa-video"></i> View Recipe</button>
                </div>
            `;

            grid.appendChild(card);
            animateCard(card, grid.querySelectorAll('.recipe-card').length - 1);
        }

        function clearStatus() {
            if (statusElement && statusElement.isConnected) {
                statusElement.remove();
            }
        }

        function showStatus(message, isError = false) {
            if (!statusElement) return;
            statusElement.textContent = message;
            statusElement.className = isError ? 'recipe-status error' : 'recipe-status';
        }

        function loadStoredRecipes() {
            const storedRecipes = JSON.parse(localStorage.getItem('userRecipes') || '[]');

            storedRecipes.forEach((recipe, index) => {
                addRecipeCard({
                    key: `userRecipe${index + 1}`,
                    title: recipe.title,
                    time: recipe.totalTime || recipe.time || 'N/A',
                    difficulty: recipe.difficulty || 'Medium',
                    description: recipe.shortDescription || recipe.description || 'User-added recipe.',
                    tags: recipe.tags || [],
                    ingredients: recipe.ingredients || [],
                    instructions: Array.isArray(recipe.instructions)
                        ? recipe.instructions.map(step => typeof step === 'string' ? { description: step } : step)
                        : [],
                    image: recipe.image || 'https://images.unsplash.com/photo-1512428559087-560fa5ceab42?auto=format&fit=crop&w=1000&q=80',
                    source: ''
                });
            });
        }

        async function loadMealDbRecipes() {
            showStatus('Loading recipes from TheMealDB...');

            try {
                const response = await fetch('https://www.themealdb.com/api/json/v1/1/latest.php');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const meals = Array.isArray(data.meals) ? data.meals.slice(0, 9) : [];

                clearStatus();

                meals.forEach((meal, index) => {
                    addRecipeCard(normalizeMealDbRecipe(meal, index));
                });

                if (meals.length === 0 && !Object.keys(recipes).length) {
                    showStatus('No recipes were returned from TheMealDB.', true);
                }
            } catch (error) {
                console.error('Failed to load TheMealDB recipes:', error);

                if (!Object.keys(recipes).length) {
                    showStatus('Could not load recipes from TheMealDB. Please check your internet connection and try again.', true);
                } else {
                    clearStatus();
                }
            }
        }

        function isYouTubeUrl(url) {
            return /youtube\.com|youtu\.be/.test(url);
        }

        function getYouTubeEmbedUrl(url) {
            const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]+)/);
            return match ? `https://www.youtube.com/embed/${match[1]}` : url;
        }

        function renderInstructionStep(step, index) {
            const description = typeof step === 'string' ? step : step.description || '';
            const imageUrl = step && typeof step !== 'string' ? step.image : '';
            const videoUrl = step && typeof step !== 'string' ? step.video : '';
            let mediaHtml = '';

            if (imageUrl) {
                mediaHtml += `\n                            <div class="step-media"><img src="${escapeHtml(imageUrl)}" alt="Step ${index + 1} image"></div>`;
            }

            if (videoUrl) {
                if (isYouTubeUrl(videoUrl)) {
                    mediaHtml += `\n                            <div class="step-media"><iframe src="${escapeHtml(getYouTubeEmbedUrl(videoUrl))}" allowfullscreen></iframe></div>`;
                } else {
                    mediaHtml += `\n                            <div class="step-media"><video controls src="${escapeHtml(videoUrl)}"></video></div>`;
                }
            }

            return `<li>${escapeHtml(description)}${mediaHtml}</li>`;
        }

        function toggleDetails(recipeId) {
            const recipe = recipes[recipeId];
            if (!recipe) return;

            const modalContent = document.getElementById('modalRecipeContent');
            const sourceHtml = recipe.source
                ? `<p class="modal-recipe-description"><a href="${escapeHtml(recipe.source)}" target="_blank" rel="noopener noreferrer">Original source</a></p>`
                : '';

            modalContent.innerHTML = `
                <div class="modal-recipe-header">
                    <h2 class="modal-recipe-title">${escapeHtml(recipe.title)}</h2>
                    <div class="modal-recipe-meta">
                        <span>Time: ${escapeHtml(recipe.time || 'N/A')}</span>
                        <span>Difficulty: ${escapeHtml(recipe.difficulty || 'Medium')}</span>
                    </div>
                </div>
                <div class="modal-recipe-body">
                    <p class="modal-recipe-description">${escapeHtml(recipe.description || '')}</p>
                    <div class="modal-recipe-tags">
                        ${(recipe.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <div class="modal-ingredients-grid">
                        ${(recipe.ingredients || []).map(ing => `<div class="modal-ingredient">${escapeHtml(ing)}</div>`).join('')}
                    </div>
                    <div class="modal-instructions">
                        <h4>Instructions:</h4>
                        <ol>
                            ${(recipe.instructions || []).map((inst, idx) => renderInstructionStep(inst, idx)).join('')}
                        </ol>
                    </div>
                    ${sourceHtml}
                </div>
            `;

            document.getElementById('recipeModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('recipeModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('recipeModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        loadStoredRecipes();
        loadMealDbRecipes();
    </script>
</body>
</html>
