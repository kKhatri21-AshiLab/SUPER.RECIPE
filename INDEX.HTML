<!DOCTYPE html>
<!-- 
    ============================================
    SUPER.RECIPE - RECIPE SHOWCASE PAGE
    ============================================
    INTEGRATED WITH MONGODB & JSON DATABASE
    
    Features:
    - Fetches recipes from Backend API (MongoDB + JSON)
    - Connected to all pages via navigation
    - Full recipe details in modal popup
    - Responsive grid layout with animations
    - Search and filter capabilities
    ============================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER.RECIPE - Interactive Recipe Showcase</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/shared-nav.css">

    <style>
        /* ================================================
           GLOBAL STYLES & RESET
           ================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            overflow-x: hidden;
        }

        /* ================================================
           NAVIGATION BAR finde error and remove
           
           ================================================ */
        .nav {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
        }
        .nav .outline { position: absolute; inset: 0; pointer-events: none; }
        .nav .rect { stroke-dashoffset: 5; stroke-dasharray: 0 0 10 40 10 40; transition: 0.5s; stroke: #e4ae0b; }
        .nav:hover .rect { transition: 999999s; stroke-dashoffset: 1; stroke-dasharray: 0; }
        .nav-container { 
            background: rgba(16,16,16,0.9); backdrop-filter: blur(10px); 
            display: flex; flex-direction: row; justify-content: space-around; align-items: center; 
            padding: 0.5em; border-radius: 40px; width: clamp(450px, 65vw, 650px); height: 60px;
        }
        .nav-btn { 
            padding: 0.5em 1.5em; color: #fff; cursor: pointer; transition: 0.3s; 
            border-radius: 10px; font-weight: 500; white-space: nowrap; background: none; border: none;
            text-decoration: none;
        }
        .nav-btn:hover { background: #e4ae0b; color: #000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(228,174,11,0.4); }
        @media (max-width: 768px) { 
            .nav-container { width: clamp(350px,75vw,450px); height: 50px; padding: 0.3em; } 
            .nav-btn { padding: 0.4em 0.8em; font-size: 0.85rem; } 
        }

        /* ================================================
           HERO SECTION
           ================================================ */
        .hero { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: white; padding: 0 20px; position: relative;
        }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem; animation: fadeInUp 1s ease-out; }
        .hero p { font-size: 1.5rem; margin-bottom: 2rem; animation: fadeInUp 1s ease-out 0.2s both; }
        .login-btn { 
            background: rgba(255,255,255,0.2); color: white; border: 2px solid rgba(255,255,255,0.5); 
            padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; font-weight: 600; 
            text-decoration: none; transition: all 0.3s; backdrop-filter: blur(10px); animation: fadeInUp 1s ease-out 0.4s both;
        }
        .login-btn:hover { background: rgba(255,255,255,0.3); border-color: white; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        /* ================================================
           RECIPE CARDS SECTION
           ================================================ */
        .recipes-section { padding: 80px 20px; max-width: 1400px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 3rem; margin-bottom: 4rem; color: #333; }
        #recipe-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; 
            animation: fadeInUp 1s ease-out;
        }
        .recipe-card { 
            background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94); cursor: pointer; opacity: 0; transform: translateY(50px);
            animation: fadeInUp 0.8s ease-out forwards; animation-fill-mode: both;
        }
        .recipe-card:nth-child(1) { animation-delay: 0.1s; }
        .recipe-card:nth-child(2) { animation-delay: 0.2s; }
        .recipe-card:nth-child(3) { animation-delay: 0.3s; }
        .recipe-card:nth-child(4) { animation-delay: 0.4s; }
        .recipe-card:nth-child(5) { animation-delay: 0.5s; }
        .recipe-card:nth-child(6) { animation-delay: 0.6s; }
        .recipe-card:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .card-img { height: 250px; object-fit: cover; width: 100%; }
        .card-content { padding: 1.5rem; }
        .card-title { font-size: 1.5rem; margin-bottom: 0.5rem; color: #333; }
        .card-desc { color: #666; margin-bottom: 1rem; font-size: 0.95rem; }
        .card-icon { color: #e4ae0b; }

        /* ================================================
           MODAL (POPUP)
           ================================================ */
        #recipe-modal { 
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); animation: fadeIn 0.3s;
        }
        .modal-content { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 900px; max-height: 90vh; background: white; 
            border-radius: 20px; padding: 2.5rem; overflow-y: auto; animation: modalSlideIn 0.3s;
            line-height: 1.6; font-size: 1.05rem;
        }
        .close { color: #aaa; float: right; font-size: 2rem; font-weight: bold; cursor: pointer; }
        .close:hover { color: #333; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 1rem; }
        .modal-title { font-size: 1.8rem; margin-bottom: 1rem; color: #333; }
        .modal-section { margin-bottom: 1.5rem; }
        .modal-section h3 { color: #e4ae0b; margin-bottom: 0.8rem; }
        .modal-section ul { margin-left: 1.5rem; }
        .modal-section li { margin-bottom: 0.5rem; }

        /* ================================================
           ANIMATIONS
           ================================================ */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalSlideIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        /* ================================================
           RESPONSIVE
           ================================================ */
        @media (max-width: 768px) { 
            .recipes-section { padding: 60px 10px; } 
            .section-title { font-size: 2.5rem; } 
            #recipe-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .hero { padding: 0 10px; height: 80vh; }
            .modal-content { width: 95%; padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="nav">
        <div class="nav-container">
            <a href="indexMain.html" class="nav-btn" title="Home"><i class="fas fa-home"></i> Home</a>
            <a href="LOGIN PAGE.HTML" class="nav-btn" title="Login"><i class="fas fa-user"></i> Login</a>
            <a href="ADD RECIPE PAGE.HTML" class="nav-btn" title="Add Recipe"><i class="fas fa-plus"></i> Add Recipe</a>
            <a href="INDEX.HTML" class="nav-btn active" title="All Recipes"><i class="fas fa-list"></i> Recipes</a>
            <a href="SEARCHING RECIPE FROM MEAL DP.html" class="nav-btn" title="Search"><i class="fas fa-search"></i> Search</a>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" height="60" width="400" class="outline">
            <rect stroke-width="5" fill="transparent" height="60" width="650" y="0" x="0" pathLength="100" class="rect"></rect>
        </svg>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Discover Delicious Recipes</h1>
        <p>🍳 From MongoDB Database & JSON Files 📚</p>
        <a href="LOGIN PAGE.HTML" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login to Save Favorites</a>
    </section>

    <!-- RECIPES SECTION -->
    <section class="recipes-section">
        <h2 class="section-title"><i class="fas fa-utensils"></i> Featured Recipes</h2>
        <div id="recipe-grid">
            <div class="loading" style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;">
                <i class="fas fa-spinner fa-spin fa-3x" style="margin-bottom: 1rem;"></i>
                <p>Loading recipes from database...</p>
            </div>
        </div>
    </section>

    <!-- RECIPE DETAILS MODAL -->
    <div id="recipe-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modal-img" class="modal-img" src="" alt="">
            <h2 id="modal-title"></h2>
            <div class="modal-section">
                <h3><i class="fas fa-list"></i> Ingredients</h3>
                <div id="modal-ing"></div>
            </div>
            <div class="modal-section">
                <h3><i class="fas fa-utensils"></i> Instructions</h3>
                <p id="modal-ins"></p>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // BACKEND API CONFIGURATION
        // ================================================
        const API_URL = 'http://localhost:5000';

        // ================================================
        // LOAD RECIPES FROM BACKEND API
        // ================================================
        async function loadRecipes() {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;"><i class="fas fa-spinner fa-spin fa-3x" style="margin-bottom: 1rem;"></i><p>Loading recipes...</p></div>';
            
            try {
                // Fetch recipes from Backend API
                // The backend combines MongoDB recipes + JSON files
                const response = await fetch(`${API_URL}/api/recipes?limit=50`);
                
                if (!response.ok) {
                    throw new Error(`API error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.success || !data.recipes) {
                    throw new Error('Invalid API response');
                }
                
                const recipes = data.recipes;
                grid.innerHTML = '';
                
                if (recipes.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #666;">No recipes found</div>';
                    return;
                }
                
                // Create recipe cards
                recipes.forEach((r, index) => {
                    if (!r.name) return;
                    
                    const imgPath = r.image || 'https://via.placeholder.com/350x250?text=Recipe+Image';
                    const desc = r.description ? r.description.slice(0, 100) + '...' : 'Delicious recipe!';
                    const fullIng = Array.isArray(r.ingredients) ? r.ingredients : (r.ingredients || []);
                    
                    let fullIns = '';
                    if (Array.isArray(r.steps)) {
                        fullIns = r.steps.join('\n');
                    } else if (r.instructions) {
                        fullIns = r.instructions;
                    } else {
                        fullIns = 'Instructions not available';
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.dataset.title = r.name;
                    card.dataset.img = imgPath;
                    card.dataset.fullIng = JSON.stringify(fullIng);
                    card.dataset.fullIns = fullIns;
                    card.dataset.author = r.author || 'Unknown';
                    card.style.animationDelay = `${0.1 * (index % 12)}s`;
                    
                    card.innerHTML = `
                        <img class="card-img" src="${imgPath}" alt="${r.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/350x250?text=Recipe';">
                        <div class="card-content">
                            <h3 class="card-title">${r.name}</h3>
                            <p class="card-desc">${desc}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <i class="fas fa-fire card-icon"></i>
                                ${r.rattings ? `<span style="color: #e4ae0b; font-size: 0.9rem;">⭐ ${r.rattings}/5</span>` : ''}
                            </div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
                
                attachModalListeners();
                
            } catch (error) {
                console.error('Error:', error);
                
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #e74c3c; background: #fdf2f2; border-radius: 15px;">
                        <i class="fas fa-exclamation-triangle fa-2x" style="margin-bottom: 1rem;"></i>
                        <p><strong>⚠ Could not load recipes from database</strong></p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">
                            <strong>Start the Backend Server:</strong><br><br>
                            <code style="background:#eee;padding:8px;border-radius:4px;display:block;margin:0.5rem 0;font-family:monospace;">
                                cd BACKEND && npm install && npm run dev
                            </code>
                        </p>
                        <p style="font-size: 0.85rem; margin-top: 1rem; color: #666;">
                            ✓ MongoDB must be running<br>
                            ✓ Backend runs on http://localhost:5000<br>
                            📝 Refresh page after starting server
                        </p>
                    </div>
                `;
            }
        }

        // ================================================
        // MODAL FUNCTIONALITY
        // ================================================
        function attachModalListeners() {
            const cards = document.querySelectorAll('.recipe-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const title = card.dataset.title;
                    const img = card.dataset.img;
                    const ing = card.dataset.fullIng;
                    const ins = card.dataset.fullIns;

                    document.getElementById('modal-title').textContent = title;
                    document.getElementById('modal-img').src = img;
                    
                    // Parse and display ingredients
                    let ingHTML = '<ul>';
                    try {
                        const ingArray = JSON.parse(ing);
                        ingArray.slice(0, 15).forEach(item => { 
                            ingHTML += `<li>${item}</li>`;
                        });
                        if (ingArray.length > 15) ingHTML += '<li style="font-weight: bold;">... and more</li>';
                    } catch (e) {
                        ingHTML += `<li>${ing}</li>`;
                    }
                    ingHTML += '</ul>';
                    document.getElementById('modal-ing').innerHTML = ingHTML;
                    
                    // Display instructions
                    document.getElementById('modal-ins').innerHTML = ins.replace(/\n/g, '<br>');
                    document.getElementById('recipe-modal').style.display = 'block';
                });
            });
        }

        // Modal controls
        const modal = document.getElementById('recipe-modal');
        const closeBtn = document.querySelector('.close');

        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.style.display = 'none'; });

        // Highlight active nav button
        document.querySelector('.nav-btn.active').style.background = '#e4ae0b';
        document.querySelector('.nav-btn.active').style.color = '#000';

        // Load recipes when page loads
        window.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
</body>
</html>
