<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER.RECIPE - Interactive Recipe Showcase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/shared-nav.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>


    <style>
        
        /* Reset and Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            overflow-x: hidden;
        }

        /* Navigation - Matching project style */
        .nav {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
        }
        .nav .outline { position: absolute; inset: 0; pointer-events: none; }
        .nav .rect { stroke-dashoffset: 5; stroke-dasharray: 0 0 10 40 10 40; transition: 0.5s; stroke: #e4ae0b; }
        .nav:hover .rect { transition: 999999s; stroke-dashoffset: 1; stroke-dasharray: 0; }
        .nav-container { 
            background: rgba(16,16,16,0.9); backdrop-filter: blur(10px); 
            display: flex; flex-direction: row; justify-content: space-around; align-items: center; 
            padding: 0.5em; border-radius: 40px; width: clamp(450px, 65vw, 650px); height: 60px;
        }
        .nav-btn { 
            padding: 0.5em 1.5em; color: #fff; cursor: pointer; transition: 0.3s; 
            border-radius: 10px; font-weight: 500; white-space: nowrap; background: none; border: none;
        }
        .nav-btn:hover { background: #e4ae0b; color: #000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(228,174,11,0.4); }
        @media (max-width: 768px) { .nav-container { width: clamp(350px,75vw,450px); height: 50px; padding: 0.3em; } .nav-btn { padding: 0.4em 0.8em; font-size: 0.85rem; } }

        /* Hero Section */
        .hero { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: white; padding: 0 20px; position: relative;
        }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem; animation: fadeInUp 1s ease-out; }
        .hero p { font-size: 1.5rem; margin-bottom: 2rem; animation: fadeInUp 1s ease-out 0.2s both; }
        .login-btn { 
            background: rgba(255,255,255,0.2); color: white; border: 2px solid rgba(255,255,255,0.5); 
            padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; font-weight: 600; 
            text-decoration: none; transition: all 0.3s; backdrop-filter: blur(10px); animation: fadeInUp 1s ease-out 0.4s both;
        }
        .login-btn:hover { background: rgba(255,255,255,0.3); border-color: white; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        /* Recipe Grid */
        .recipes-section { padding: 80px 20px; max-width: 1400px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 3rem; margin-bottom: 4rem; color: #333; }
        #recipe-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; 
            animation: fadeInUp 1s ease-out;
        }
        .recipe-card { 
            background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94); cursor: pointer; opacity: 0; transform: translateY(50px);
            animation: fadeInUp 0.8s ease-out forwards; animation-fill-mode: both;
        }
        .recipe-card:nth-child(1) { animation-delay: 0.1s; }
        .recipe-card:nth-child(2) { animation-delay: 0.2s; }
        .recipe-card:nth-child(3) { animation-delay: 0.3s; }
        .recipe-card:nth-child(4) { animation-delay: 0.4s; }
        .recipe-card:nth-child(5) { animation-delay: 0.5s; }
        .recipe-card:nth-child(6) { animation-delay: 0.6s; }
        .recipe-card:nth-child(7) { animation-delay: 0.7s; }
        .recipe-card:nth-child(8) { animation-delay: 0.8s; }
        .recipe-card:nth-child(9) { animation-delay: 0.9s; }
        .recipe-card:nth-child(10) { animation-delay: 1s; }
        .recipe-card:nth-child(11) { animation-delay: 1.1s; }
        .recipe-card:nth-child(12) { animation-delay: 1.2s; }
        .recipe-card:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .card-img { height: 250px; object-fit: cover; width: 100%; }
        .card-content { padding: 1.5rem; }
        .card-title { font-size: 1.5rem; margin-bottom: 0.5rem; color: #333; }
        .card-desc { color: #666; margin-bottom: 1rem; }
        .card-icon { color: #e4ae0b; }

        /* Modal */
        #recipe-modal { 
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); animation: fadeIn 0.3s;
        }
        .modal-content { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 900px; max-height: 90vh; background: white; 
            border-radius: 20px; padding: 2.5rem; overflow-y: auto; animation: modalSlideIn 0.3s;
            line-height: 1.6; font-size: 1.05rem;
        }

        .close { color: #aaa; float: right; font-size: 2rem; font-weight: bold; cursor: pointer; }
        .close:hover { color: #333; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 1rem; }
        .modal-title { font-size: 1.8rem; margin-bottom: 1rem; }
        .modal-section { margin-bottom: 1.5rem; }
        .modal-section h3 { color: #e4ae0b; margin-bottom: 0.5rem; }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalSlideIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        /* Responsive */
        @media (max-width: 768px) { 
            .recipes-section { padding: 60px 10px; } 
            .section-title { font-size: 2.5rem; } 
            #recipe-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .hero { padding: 0 10px; height: 80vh; }
        }
        @media (min-width: 769px) and (max-width: 1024px) { #recipe-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <button class="nav-btn" onclick="location.href='indexMain.html'"><i class="fas fa-home"></i> Home</button>
            <a href="LOGIN PAGE.HTML" class="nav-btn login-nav"><i class="fas fa-user"></i> Login</a>
            <button class="nav-btn" onclick="location.href='ADD RECIPE PAGE.HTML'"><i class="fas fa-plus"></i> Add Recipe</button>
            <button class="nav-btn active" onclick="location.href='INDEX.HTML'"><i class="fas fa-list"></i> Recipes</button>
            <button class="nav-btn" onclick="location.href='SEARCHING RECIPE FROM MEAL DP.html'"><i class="fas fa-search"></i> Search</button>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" height="60" width="400" class="outline">
            <rect stroke-width="5" fill="transparent" height="60" width="650" y="0" x="0" pathLength="100" class="rect"></rect>
        </svg>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Discover Delicious Recipes</h1>
        <p>Interactive showcase of mouthwatering dishes</p>
        <a href="LOGIN PAGE.HTML" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login to Save Favorites</a>
    </section>

    <!-- Recipes Section -->
    <section class="recipes-section">
        <h2 class="section-title"><i class="fas fa-utensils"></i> Featured Recipes</h2>
        <div id="recipe-grid">
            <div class="loading" style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;">
                <i class="fas fa-spinner fa-spin fa-3x" style="margin-bottom: 1rem;"></i>
                <p>Loading recipes from dataset...</p>
            </div>
        </div>

    </section>

    <!-- Modal -->
    <div id="recipe-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modal-img" class="modal-img" src="" alt="">
            <h2 id="modal-title"></h2>
            <div class="modal-section">
                <h3><i class="fas fa-list"></i> Ingredients</h3>
                <p id="modal-ing"></p>
            </div>
            <div class="modal-section">
                <h3><i class="fas fa-utensils"></i> Instructions</h3>
                <p id="modal-ins"></p>
            </div>
        </div>
    </div>

    <script>
        // Load recipes from CSV
        async function loadRecipes() {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #666;"><i class="fas fa-spinner fa-spin fa-3x" style="margin-bottom: 1rem;"></i><p>Loading recipes from dataset...</p></div>';
            
            try {
                const response = await fetch('DATASET/Food Ingredients and Recipe Dataset with Image Name Mapping.csv');
                // Check if CSV loaded - logs to console for debugging
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - CSV file not found or inaccessible.`);
                }
                const csvText = await response.text();
                const recipes = Papa.parse(csvText, {header: true, skipEmptyLines: true}).data.slice(0, 50); // First 50 recipes
                
                grid.innerHTML = '';
                recipes.forEach((r, index) => {
                    if (!r.Title || !r.Image_Name) return;
                    const imgPath = `DATASET/Food Images/Food Images/${r.Image_Name}.jpg`;
                    const desc = r.Instructions ? r.Instructions.slice(0, 100) + '...' : 'Delicious recipe!';
                    const fullIng = r.Ingredients || 'Ingredients not available';
                    const fullIns = r.Instructions || 'Instructions not available';
                    
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.dataset.title = r.Title;
                    card.dataset.img = imgPath;
                    card.dataset.desc = desc;
                    card.dataset.fullIng = fullIng;
                    card.dataset.fullIns = fullIns;
                    card.style.animationDelay = `${0.1 * index}s`;
                    card.innerHTML = `
                        <img class="card-img" src="${imgPath}" alt="${r.Title}" loading="lazy" onerror="this.src='DATASET/Food Images/Food Images/3-ingredient-caramel-apple-tart.jpg';">
                        <div class="card-content">
                            <h3 class="card-title">${r.Title}</h3>
                            <p class="card-desc">${desc}</p>
                            <i class="fas fa-fire card-icon"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                // Re-attach event listeners
                attachModalListeners();
                
            } catch (error) {
                console.error('Error loading recipes:', error);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #e74c3c;"><i class="fas fa-exclamation-triangle fa-3x" style="margin-bottom: 1rem;"></i><p>Error loading recipes. Showing samples.</p></div>';
            }
        }

        function attachModalListeners() {
            const cards = document.querySelectorAll('.recipe-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const title = card.dataset.title;
                    const img = card.dataset.img;
                    const ing = card.dataset.fullIng;
                    const ins = card.dataset.fullIns;

                    document.getElementById('modal-title').textContent = title;
                    document.getElementById('modal-img').src = img;
                    
                    // Parse ingredients JSON array
                    let ingHTML = '<ul style="margin: 0; padding-left: 1.5rem;">';
                    try {
                        const ingArray = JSON.parse(ing.replace(/'/g, '"'));
                        ingArray.slice(0, 15).forEach(item => { // Limit to 15
                            ingHTML += `<li>${item}</li>`;
                        });
                        if (ingArray.length > 15) ingHTML += '<li>...</li>';
                    } catch (e) {
                        ingHTML += `<li>${ing}</li>`;
                    }
                    ingHTML += '</ul>';
                    document.getElementById('modal-ing').innerHTML = ingHTML;
                    
                    document.getElementById('modal-ins').innerHTML = ins.replace(/\n/g, '<br>');

                    document.getElementById('recipe-modal').style.display = 'block';
                });
            });
        }

        // Modal functionality
        const modal = document.getElementById('recipe-modal');
        const closeBtn = document.querySelector('.close');

        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.style.display = 'none'; });

        // Active nav highlight
        document.querySelector('.nav-btn.active').style.background = '#e4ae0b';
        document.querySelector('.nav-btn.active').style.color = '#000';

        // Load recipes on page load
        window.addEventListener('DOMContentLoaded', loadRecipes);
    </script>

</body>
</html>
