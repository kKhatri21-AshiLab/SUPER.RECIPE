<!-- 
  ============================================
  LANDING PAGE - indexMain.html - BEGINNER GUIDE
  ============================================
  FILE PURPOSE: Home page with ingredient tag search system
  
  WHAT THIS PAGE DOES:
    1. Hero background image with "Supercook" branding
    2. Interactive ingredient tag creator 
    3. Sticky navigation header
    4. Responsive mobile-first design
  
  KEY FEATURES:
    - Type ingredient → click Add → tag appears instantly
    - Form submit OR button click both work
    - Hover animations on Add button
    - Flexbox for perfect centering
  
  LEARNING POINTS:
    - CSS Sticky positioning
    - Background images & hero sections
    - JavaScript DOM manipulation (createElement)
    - Event listeners (submit + click)
    - Array storage (tags[])
  ============================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- UTF-8: Supports all characters/emojis worldwide -->
    <meta charset="UTF-8">
    <!-- Mobile responsive: Scales perfectly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser tab title + SEO -->
    <title>SuperCook - Home & Ingredient Search</title>

<style>
        /* 
         ============ CSS RESET (APPLIES TO ALL ELEMENTS) ============
         box-sizing: border-box = padding/borders INCLUDED in width
         margin/padding: 0 = remove browser defaults
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* BODY: Main page styling */
        body {
            /* Typography: Font + line spacing */
            font-family: Arial, sans-serif;
            line-height: 1.6;
            /* Light cyan background */
            background-color: #95ebeb;
        }

        /* HEADER: Navigation - STAYS AT TOP when scrolling */
        header {
            /* Dark navy (#04072b) background */
            background-color: #04072b;
            /* Pink text */
            color: #f7b2f3;
            padding: 1em;
            text-align: center;
            border-bottom: 1px solid #444;
            /* STICKY MAGIC: Sticks to top */
            position: sticky;
            top: 0;
        }

/* Enhanced responsive navigation */
header {
    background: linear-gradient(135deg, #04072b 0%, #1a1f3d 100%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 1000;
}

header > nav {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.logo {
    font-size: 1.8rem;
    font-weight: bold;
    color: #f7b2f3;
    text-decoration: none;
}

.nav-search {
    flex: 0 1 300px;
    max-width: 300px;
    margin-left: 1rem;
    position: relative;
}

.nav-search input {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.5rem;
    border: 2px solid rgba(247,178,243,0.3);
    border-radius: 25px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 1rem;
    backdrop-filter: blur(10px);
}

.nav-search input::placeholder {
    color: rgba(255,255,255,0.7);
}

.nav-search input:focus {
    outline: none;
    border-color: #f7b2f3;
    box-shadow: 0 0 0 3px rgba(247,178,243,0.2);
}

.nav-menu {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 0.5rem;
}

.nav-menu li a {
    display: block;
    padding: 0.8rem 1.2rem;
    color: #fff;
    text-decoration: none;
    border-radius: 20px;
    font-weight: 500;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.nav-menu li a:hover,
.nav-menu li a.active {
    background: rgba(247,178,243,0.2);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(247,178,243,0.3);
}

.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 4px;
    padding: 0.5rem;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: #f7b2f3;
    border-radius: 3px;
    transition: all 0.3s ease;
}

@media (max-width: 768px) {
    .nav-menu {
        position: fixed;
        top: 100%;
        left: 0;
        width: 100%;
        background: #04072b;
        flex-direction: column;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .nav-menu.active {
        max-height: 500px;
        padding: 1rem 0;
    }
    
    .hamburger {
        display: flex;
    }
    
    .nav-search {
        flex: 0 1 200px;
        max-width: 400px;
        margin-left: 0.5rem;
    }
    
    header > nav {
        padding: 1rem;
    }
}

@media (max-width: 480px) {
    .logo {
        font-size: 1.5rem;
    }
    
    .nav-search {
        flex: 0 1 180px;
        max-width: 180px;
        margin-left: 0.5rem;
    }
}

main {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hero {
    background-image: url('./img/First.jpg');
    height: 800px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    background-repeat: no-repeat;
}

.hero-inner {
    justify-content: center;
    align-items: center;
}

#search-form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#search-input {
    padding: 10px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    width: 250px;
}

#add-button {
    background-color: #333;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

#add-button:hover{
    background-color: #e78484;
    color: blue;
    font-size: 20px;
    border-radius: 10px;
}

#search-feed {
    margin-top: 20px;
}

.tag {
    background-color: #333;
    color: #fff;
    padding: 5px 10px;
    border-radius: 5px;
    margin: 5px;
    display: inline-block;
}

footer {
    color: #04072b; 
}
</style>

   
</head>
<body>
<header>
        <nav role="navigation" aria-label="Main navigation">
            <a href="indexMain.html" class="logo" aria-label="Super Cook Book Home">🍳 SuperCook</a>
            <div class="nav-search">
                <input type="text" placeholder="Search recipes..." id="nav-search">
                <button onclick="performNavSearch()" aria-label="Search">🔍</button>
            </div>
            
            <ul class="nav-menu" id="nav-menu">
                <li><a href="./SEARCHING RECIPE FROM MEAL DP.html" aria-label="Browse Recipes">Recipes</a></li>
                <li><a href="./INDEX.HTML" aria-label="View Cookbooks">Cookbooks</a></li>
                <li><a href="#" aria-label="Meal Planner">Meal Planner</a></li>
                <li><a href="#" aria-label="Grocery List">Grocery List</a></li>
                <li><a href="#" aria-label="PDF Resources">PDFs</a></li>
                <li><a href="#" aria-label="Community Posts">Posts</a></li>
                <li><a href="#" aria-label="Feeds">Feeds</a></li>
                <li><a href="./ADD RECIPE PAGE.HTML" aria-label="Add New Recipe">Add Recipe</a></li>
            </ul>
            
            <div class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Toggle menu" role="button" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero-inner">
                <h1>Supercook</h1>
                <p>Find recipes based on ingredients you already have!</p>
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="Enter ingredients...">
                    <button id="add-button">Add</button>
                    <div id="search-feed"></div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Supercook</p>
    </footer>

    <script>
function toggleMenu() {
    const menu = document.getElementById('nav-menu');
    const hamburger = document.getElementById('hamburger');
    menu.classList.toggle('active');
    hamburger.classList.toggle('active');
    
    // Animate hamburger lines
    const lines = hamburger.querySelectorAll('span');
    lines[0].style.transform = menu.classList.contains('active') ? 'rotate(45deg) translate(5px, 5px)' : 'none';
    lines[1].style.opacity = menu.classList.contains('active') ? '0' : '1';
    lines[2].style.transform = menu.classList.contains('active') ? 'rotate(-45deg) translate(7px, -6px)' : 'none';
}

function performNavSearch() {
    const input = document.getElementById('nav-search');
    if (input.value.trim()) {
        alert(`Searching for: ${input.value}`); // TODO: Integrate with search
        input.value = '';
    }
}

// Close menu on window resize (back to desktop)
window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
        document.getElementById('nav-menu').classList.remove('active');
        document.getElementById('hamburger').classList.remove('active');
    }
});

// Keyboard support
document.getElementById('hamburger').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleMenu();
    }
});

const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const addButton = document.getElementById('add-button');
const searchFeed = document.getElementById('search-feed');

let tags = [];

searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.textContent = inputValue;
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
    }
});

addButton.addEventListener('click', () => {
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.textContent = inputValue;
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
    }
});
    </script>
</body>

</html>
