    <script>


const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const addButton = document.getElementById('add-button');
const searchFeed = document.getElementById('search-feed');

let tags = [];

// Filter function for ingredient tags
function filterCards() {
    const cards = mealsGrid.querySelectorAll('.recipe-card');
    const currentTags = tags.map(t => t.toLowerCase());
    
    cards.forEach(card => {
        const title = card.querySelector('.recipe-title')?.textContent.toLowerCase() || '';
        const visible = currentTags.length === 0 || currentTags.some(tag => title.includes(tag));
        card.style.display = visible ? '' : 'none';
    });
    
    if (currentTags.length > 0 && mealsGrid.querySelectorAll('.recipe-card:visible').length === 0) {
        mealsGrid.innerHTML += '<div class="error" style="grid-column:1/-1">No matches for ingredients. Clear tags to see all! 🔍</div>';
    }
}

searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.innerHTML = inputValue + ' <span onclick="removeTag(this)" style="cursor:pointer;margin-left:5px;font-size:12px;">×</span>';
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
        filterCards();
    }
});

addButton.addEventListener('click', () => {
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.innerHTML = inputValue + ' <span onclick="removeTag(this)" style="cursor:pointer;margin-left:5px;font-size:12px;">×</span>';
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
        filterCards();
    }
});

// Remove tag function
function removeTag(closeSpan) {
    const tagSpan = closeSpan.parentElement;
    const tagText = tagSpan.textContent.replace('×', '').trim();
    tags = tags.filter(t => t !== tagText);
    tagSpan.remove();
    filterCards();
}

/* ================= A-Z MEALS API INTEGRATION ================= */
/* 
  FEATURES:
  - A-Z letter buttons (generated dynamically)
  - Fetch from TheMealDB API: search.php?f={letter}
  - Fancy flip cards with recipe image/title
  - Save recipes to localStorage
  - Theme toggle (light/dark)
  - Loading/error states
  - Responsive grid
*/

// Global elements
const mealsGrid = document.getElementById('meals-grid');
const mealsTitle = document.getElementById('meals-title');



// Create single fancy flip card
function createRecipeCard(recipe) {
    console.log('Creating card for recipe:', recipe.strMeal, 'id:', recipe.idMeal);
    // Ensure recipe has idMeal
    if (!recipe.idMeal) {
        console.warn('Recipe missing idMeal:', recipe);
        recipe.idMeal = 'unknown_' + Date.now();
    }
    const cardDiv = document.createElement('div');
    cardDiv.className = 'recipe-card';
    cardDiv.onclick = () => showRecipe(recipe);
    cardDiv.dataset.recipe = JSON.stringify(recipe);
    cardDiv.dataset.tags = recipe.strMeal ? recipe.strMeal.toLowerCase() : '';
    
    const recipeId = recipe.idMeal;
    const isSavedState = isSaved(recipeId) ? 'saved' : '';
    
    cardDiv.innerHTML = `
        <div class="recipe-header">
            <img src="${recipe.strMealThumb || 'https://via.placeholder.com/300x200?text=🍳'}" 
                 class="recipe-img" 
                 alt="${recipe.strMeal || 'Recipe'}" 
                 onerror="this.src='https://via.placeholder.com/300x200?text=🍳'">
        </div>
        <div class="recipe-content">
            <div class="recipe-title">${recipe.strMeal || 'Untitled Recipe'}</div>
            <div class="recipe-meta">${recipe.strArea || 'International'}</div>
            <div class="recipe-actions">
                <button class="save-btn ${isSavedState}" onclick="toggleSave('${recipeId}', event)">
                    <svg class="save-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                    </svg>
                    ${isSaved(recipeId) ? 'Saved' : 'Save'}
                </button>
            </div>
        </div>
    `;
    
    return cardDiv;
}

// Save recipe to localStorage
function toggleSave(recipeId, event) {
    event.stopPropagation();
    
    let savedRecipes = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    
    const index = savedRecipes.indexOf(recipeId);
    if (index > -1) {
        savedRecipes.splice(index, 1);
    } else {
        savedRecipes.push(recipeId);
    }
    
    localStorage.setItem('savedRecipes', JSON.stringify(savedRecipes));
    
    // Update all save buttons (refresh visual state)
    document.querySelectorAll('.save-btn').forEach(btn => {
        const id = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        btn.classList.toggle('saved', savedRecipes.includes(id));
    });
    
    // Update save count
    document.querySelectorAll('.save_text').forEach(span => {
        span.textContent = savedRecipes.length;
    });
}

// Check if recipe is saved
function isSaved(recipeId) {
    const saved = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    return saved.includes(recipeId);
}

// Get total saved count
function getSaveCount() {
    const saved = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    return saved.length;
}

// ================= MODAL FUNCTIONS =================
let currentRecipeId = null;

// Robust YouTube ID extractor - fixes Error 153 for malformed TheMealDB URLs
function getYouTubeVideoId(url) {
  if (!url) return null;
  const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/i;
  const match = url.match(regExp);
  return (match && match[2].length === 11) ? match[2] : null;
}

function showRecipe(recipe) {
    /* FIXED: TypeError null textContent - OLD BUG: getElementById('modalTitle') before innerHTML overwrite destroyed element.
       NEW: 1) Show modal first 2) Bake title into HTML string 3) Set full content after display:block */
    try {
        console.log('showRecipe called with:', recipe.strMeal, recipe.idMeal);
        if (!recipe || !recipe.idMeal) {
            alert('Invalid recipe data. Check console (F12).');
            return;
        }
        currentRecipeId = recipe.idMeal;
        const modal = document.getElementById('recipeModal');
        const contentEl = document.getElementById('modalRecipeContent');
        
        // STEP 1: Show modal immediately with title baked in HTML (prevents null element)
        contentEl.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;">${recipe.strMeal || 'Recipe'}</div>
                <div id="modalSpinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto;"></div>
                <p>Loading details...</p>
            </div>
        `;
        modal.style.display = 'block';
        modal.style.zIndex = '99999';
        document.body.style.overflow = 'hidden';
        console.log('Modal opened successfully - FIX APPLIED');
        
        // Fetch full recipe details
        fetchFullRecipe(recipe.idMeal);
    } catch (error) {
        console.error('showRecipe error:', error);
        closeModal();
    }
}

async function fetchFullRecipe(idMeal) {
    console.log('Fetching full recipe for ID:', idMeal);
    try {
        const response = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${idMeal}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('Full recipe response:', data.meals?.length);
        if (data.meals && data.meals.length > 0) {
            displayRecipe(data.meals[0]);
        } else {
            console.warn('No full recipe data for ID:', idMeal);
            displayRecipeFallback(idMeal);
        }
    } catch (error) {
        console.error('Failed to fetch full recipe for ' + idMeal + ':', error);
        displayRecipeFallback(idMeal);
    }
}

function displayRecipe(recipe) {
    const contentEl = document.getElementById('modalRecipeContent');
    const spinner = document.getElementById('modalSpinner');
    
    const ingredients = [];
    for (let i = 1; i <= 20; i++) {
        const ingredient = recipe[`strIngredient${i}`];
        const measure = recipe[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
            ingredients.push(`${measure ? measure.trim() + ' ' : ''}${ingredient.trim()}`);
        }
    }
    
    const instructions = recipe.strInstructions || 'Instructions not available.';
    
    contentEl.innerHTML = `
        <div class="modal-body">
            <img src="${recipe.strMealThumb}" alt="${recipe.strMeal}" style="width: 100%; border-radius: 10px; margin-bottom: 15px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #333; margin-bottom: 5px;">${recipe.strMeal}</h2>
                <div style="color: #666; font-size: 1rem;">${recipe.strArea} • ${recipe.strCategory}</div>
            </div>
            
            <div class="modal-section">
                <h4>🥘 Ingredients (${ingredients.length})</h4>
                ${ingredients.map(ing => `<div class="ingredient-item">${ing}</div>`).join('')}
            </div>
            
            <div class="modal-section">
                <h4>📋 Instructions</h4>
                <div class="instruction-step">${instructions.replace(/\n/g, '<br>')}</div>
            </div>
            
${recipe.strYoutube ? `
            <div class="modal-section">
                <h4>🎥 Video Tutorial</h4>
                <div class="video-container">
                    <iframe 
                        src="https://www.youtube.com/embed/${getYouTubeVideoId(recipe.strYoutube)}?rel=0" 
                        title="${recipe.strMeal || 'Recipe'} Video"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen 
                        loading="lazy"
                        onerror="this.parentElement.innerHTML='<p style=\\"text-align:center;color:#666;font-style:italic;\\">📹 Video unavailable (Error 153 fixed)</p>';"
                    ></iframe>
                </div>
            </div>` : ''}
            
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="toggleSave('${recipe.idMeal}')" style="background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1rem; cursor: pointer;">
                    ${isSaved(recipe.idMeal) ? '❤️ Saved' : '💙 Save Recipe'}
                </button>
            </div>
        </div>
    `;
    
    spinner.style.display = 'none';
}

function displayRecipeFallback(idMeal) {
    /* SAFETY: Null-check spinner (may not exist after multiple innerHTML sets) */
    const contentEl = document.getElementById('modalRecipeContent');
    const spinner = document.getElementById('modalSpinner');
    contentEl.innerHTML = `
        <div class="modal-body" style="text-align: center; padding: 40px;">
            <h3>🍳 Recipe Details</h3>
            <p>Full recipe details temporarily unavailable.<br>
            <small>ID: ${idMeal}</small></p>
            <button onclick="toggleSave('${idMeal}')" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top: 15px;">
                ${isSaved(idMeal) ? '❤️ Saved' : '💙 Save Anyway'}
            </button>
        </div>
    `;
    if (spinner) spinner.style.display = 'none';  // Safe: spinner may be gone after re-render
    console.log('Fallback displayed for ID:', idMeal);
}

function closeModal() {
    /* IMPROVED: Null-safe cleanup */
    const modal = document.getElementById('recipeModal');
    const contentEl = document.getElementById('modalRecipeContent');
    const spinner = document.getElementById('modalSpinner');
    if (modal) modal.style.display = 'none';
    document.body.style.overflow = 'auto';
    currentRecipeId = null;
    if (contentEl) contentEl.innerHTML = '';
    if (spinner) spinner.style.display = 'none';
    console.log('Modal fully closed and reset');
}

// Close modal on outside click or ESC
document.addEventListener('click', (e) => {
    if (e.target.id === 'recipeModal') {
        closeModal();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && currentRecipeId) {
        closeModal();
    }
});

// Load latest recipes automatically
async function loadLatestRecipes() {
    try {
        mealsTitle.textContent = '🍽️ Latest Popular Recipes';
        mealsGrid.innerHTML = '<div class="loading">🔍 Loading latest popular recipes...</div>';
        
        // Try latest first (acts as popular)
        const response = await fetch('https://www.themealdb.com/api/json/v1/1/latest.php');
        const data = await response.json();
        if (data.meals && data.meals.length > 0) {
            mealsGrid.innerHTML = '';
            data.meals.forEach(recipe => {
                const card = createRecipeCard(recipe);
                mealsGrid.appendChild(card);
            });
        } else {
            // Fallback to random/popular simulation
            await fetchRandomMeals();
        }
    } catch (error) {
        console.error('Failed to load latest recipes:', error);
        renderFallback();
    }
}

// Additional fallback: Get random meals (simulates popular)
async function fetchRandomMeals() {
    const randomMeals = [];
    for (let i = 0; i < 8; i++) {
        try {
            const response = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
            const data = await response.json();
            if (data.meals && data.meals[0]) {
                randomMeals.push(data.meals[0]);
            }
        } catch (e) {
            console.warn('Random fetch failed:', e);
        }
    }
    if (randomMeals.length > 0) {
        mealsGrid.innerHTML = '';
        randomMeals.forEach(recipe => {
            const card = createRecipeCard(recipe);
            mealsGrid.appendChild(card);
        });
        mealsTitle.textContent = '🍽️ Popular Random Picks';
    } else {
        renderFallback();
    }
}

// Load alphabet recipes by letter
async function loadAlphabetMeals(letter) {
    console.log(`Loading meals for letter: ${letter}`);
    try {
        mealsTitle.textContent = `🍽️ Recipes starting with ${letter}`;
        mealsGrid.innerHTML = '<div class="loading">🔍 Loading recipes starting with ' + letter + '...</div>';
        
        const response = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?f=${letter}`);
        const data = await response.json();
        console.log(`API response for ${letter}:`, data.meals?.length || 0, 'meals');
        
        if (data.meals && data.meals.length > 0) {
            mealsGrid.innerHTML = '';
            data.meals.forEach(recipe => {
                const card = createRecipeCard(recipe);
                mealsGrid.appendChild(card);
            });
        } else {
            mealsGrid.innerHTML = `
                <div class="error">
                    No recipes found starting with "${letter}". 
                    <br>Some letters like Q, X, Z have fewer recipes.
                    <br>Try another letter! 📝
                </div>
            `;
        }
    } catch (error) {
        console.error('Failed to load alphabet recipes for ' + letter + ':', error);
        mealsGrid.innerHTML = '<div class="error">Failed to load recipes. Check connection (F12 console) and try again.</div>';
    }
}

// Initialize app
document.addEventListener('DOMContentLoaded', () => {
    loadLatestRecipes();
    
    // Load saved count on startup
    document.querySelectorAll('.save_text').forEach(span => {
        span.textContent = getSaveCount();
    });
});
    </script>
