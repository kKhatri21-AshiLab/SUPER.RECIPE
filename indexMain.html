    <script>


const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const addButton = document.getElementById('add-button');
const searchFeed = document.getElementById('search-feed');

let tags = [];

// Filter function for ingredient tags
function filterCards() {
    const cards = mealsGrid.querySelectorAll('.recipe-card');
    const currentTags = tags.map(t => t.toLowerCase());
    
    cards.forEach(card => {
        const title = card.querySelector('.recipe-title')?.textContent.toLowerCase() || '';
        const visible = currentTags.length === 0 || currentTags.some(tag => title.includes(tag));
        card.style.display = visible ? '' : 'none';
    });
    
    if (currentTags.length > 0 && mealsGrid.querySelectorAll('.recipe-card:visible').length === 0) {
        mealsGrid.innerHTML += '<div class="error" style="grid-column:1/-1">No matches for ingredients. Clear tags to see all! 🔍</div>';
    }
}

searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.innerHTML = inputValue + ' <span onclick="removeTag(this)" style="cursor:pointer;margin-left:5px;font-size:12px;">×</span>';
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
        filterCards();
    }
});

addButton.addEventListener('click', () => {
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.innerHTML = inputValue + ' <span onclick="removeTag(this)" style="cursor:pointer;margin-left:5px;font-size:12px;">×</span>';
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
        filterCards();
    }
});

// Remove tag function
function removeTag(closeSpan) {
    const tagSpan = closeSpan.parentElement;
    const tagText = tagSpan.textContent.replace('×', '').trim();
    tags = tags.filter(t => t !== tagText);
    tagSpan.remove();
    filterCards();
}

/* ================= A-Z MEALS API INTEGRATION ================= */
/* 
  FEATURES:
  - A-Z letter buttons (generated dynamically)
  - Fetch from TheMealDB API: search.php?f={letter}
  - Fancy flip cards with recipe image/title
  - Save recipes to localStorage
  - Theme toggle (light/dark)
  - Loading/error states
  - Responsive grid
*/

// Global elements
const mealsGrid = document.getElementById('meals-grid');
const mealsTitle = document.getElementById('meals-title');



// Create single fancy flip card
function createRecipeCard(recipe) {
    console.log('Creating card for recipe:', recipe.strMeal, 'id:', recipe.idMeal);
    // Ensure recipe has idMeal
    if (!recipe.idMeal) {
        console.warn('Recipe missing idMeal:', recipe);
        recipe.idMeal = 'unknown_' + Date.now();
    }
    const cardDiv = document.createElement('div');
    cardDiv.className = 'recipe-card';
    cardDiv.onclick = () => showRecipe(recipe);
    cardDiv.dataset.recipe = JSON.stringify(recipe);
    cardDiv.dataset.tags = recipe.strMeal ? recipe.strMeal.toLowerCase() : '';
    
    const recipeId = recipe.idMeal;
    const isSavedState = isSaved(recipeId) ? 'saved' : '';
    
    cardDiv.innerHTML = `
        <div class="recipe-header">
            <img src="${recipe.strMealThumb || 'https://via.placeholder.com/300x200?text=🍳'}" 
                 class="recipe-img" 
                 alt="${recipe.strMeal || 'Recipe'}" 
                 onerror="this.src='https://via.placeholder.com/300x200?text=🍳'">
        </div>
        <div class="recipe-content">
            <div class="recipe-title">${recipe.strMeal || 'Untitled Recipe'}</div>
            <div class="recipe-meta">${recipe.strArea || 'International'}</div>
            <div class="recipe-actions">
                <!-- FIXED: Changed from inline onclick to data attribute for safety -->
                <!-- This prevents 'recipe not defined' error -->
                <button class="save-btn ${isSavedState}" data-recipe-id="${recipeId}">
                    <svg class="save-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                    </svg>
                    ${isSaved(recipeId) ? 'Saved' : 'Save'}
                </button>
            </div>
        </div>
    `;
    
    return cardDiv;
}


    
 
   

// Check if recipe is saved
function isSaved(recipeId) {
    const saved = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    return saved.includes(recipeId);
}

// Get total saved count
function getSaveCount() {
    const saved = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    return saved.length;
}

// ============================================
// ADDED: SAVE/UNSAVE RECIPE FUNCTION
// ============================================
/**
 * toggleSave() - ADDED FUNCTION
 * Saves or unsaves a recipe from user's collection
 * 
 * HOW IT WORKS:
 *   1. Gets current saved recipes from browser storage
 *   2. If recipe already saved → remove it (unsave)
 *   3. If recipe not saved → add it (save)
 *   4. Updates localStorage with new list
 *   5. Updates button appearance (color/text change)
 */
function toggleSave(recipeId, event) {
    // Prevent card click event from triggering modal
    event.stopPropagation();
    
    // Get current saved recipes list
    let saved = JSON.parse(localStorage.getItem('savedRecipes') || '[]');
    
    // Toggle: Add if not present, remove if present
    if (saved.includes(recipeId)) {
        saved = saved.filter(id => id !== recipeId);
        console.log('Recipe removed from saved:', recipeId);
    } else {
        saved.push(recipeId);
        console.log('Recipe saved:', recipeId);
    }
    
    // Store updated list in browser local storage
    localStorage.setItem('savedRecipes', JSON.stringify(saved));
    
    // Update button appearance
    const button = event.target.closest('.save-btn');
    if (button) {
        button.classList.toggle('saved');
        button.textContent = button.classList.contains('saved') ? '✓ Saved' : '💾 Save';
    }
}

/**

 *   Loads popular/latest recipes from TheMealDB API when page loads

 * FIXED ISSUES:

 *   ✅ Shows loading spinner while fetching from API
 *   ✅ Renders recipe cards that can be clicked
 *   ✅ Falls back to random meals if latest doesn't work
 *   ✅ Shows fallback recipes if API is unavailable
 * 
 * HOW IT WORKS:
 *   1. Updates page title to "🍽️ Latest Popular Recipes"
 *   2. Shows loading message: "🔍 Loading latest popular recipes..."
 *   3. Fetches from: https://www.themealdb.com/api/json/v1/1/latest.php
 *   4. Creates recipe cards using createRecipeCard() function
 *   5. If API fails, falls back to randomMeals or staticRecipes
 *   6. Each card is clickable to open recipe modal popup
 */
// Load latest recipes automatically
async function loadLatestRecipes() {
    try {
        mealsTitle.textContent = '🍽️ Latest Popular Recipes';
        mealsGrid.innerHTML = '<div class="loading">🔍 Loading latest popular recipes...</div>';
        
        // Try latest first (acts as popular)
        const response = await fetch('https://www.themealdb.com/api/json/v1/1/latest.php');
        const data = await response.json();
        if (data.meals && data.meals.length > 0) {
            mealsGrid.innerHTML = '';
            data.meals.forEach(recipe => {
                const card = createRecipeCard(recipe);
                mealsGrid.appendChild(card);
            });
            console.log('Latest recipes loaded successfully:', data.meals.length, 'recipes');
        } else {
            // Fallback to random/popular simulation
            await fetchRandomMeals();
        }
    } catch (error) {
        console.error('Failed to load latest recipes:', error);
        renderFallback();
    }
}

// Additional fallback: Get random meals (simulates popular)
async function fetchRandomMeals() {
    const randomMeals = [];
    for (let i = 0; i < 8; i++) {
        try {
            const response = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
            const data = await response.json();
            if (data.meals && data.meals[0]) {
                randomMeals.push(data.meals[0]);
            }
        } catch (e) {
            console.warn('Random fetch failed:', e);
        }
    }
    if (randomMeals.length > 0) {
        mealsGrid.innerHTML = '';
        randomMeals.forEach(recipe => {
            const card = createRecipeCard(recipe);
            mealsGrid.appendChild(card);
        });
        mealsTitle.textContent = '🍽️ Popular Random Picks';
    } else {
        renderFallback();
    }
}

// Load alphabet recipes by letter
/**
 * loadAlphabetMeals(letter) - ADDED DETAILED COMMENTS
 * 
 * PURPOSE:
 *   Loads recipes that start with a specific letter (A-Z)
 *   Called when user clicks alphabet buttons (A, B, C, ... Z)
 * 
 * PARAMETERS:
 *   @param {string} letter - Single letter to search (e.g., "A", "C", "M")
 * 
 * WHAT HAPPENS:
 *   1. Updates title to show: "🍽️ Recipes starting with [LETTER]"
 *   2. Shows loading spinner: "🔍 Loading recipes starting with [LETTER]..."
 *   3. Fetches from API: https://www.themealdb.com/api/json/v1/1/search.php?f=[LETTER]
 *   4. Creates recipe cards for each result
 *   5. Shows error if no recipes found (some letters like Q, X have few recipes)
 *   6. Each card is clickable to open recipe detail modal
 * 
 * EXAMPLE:
 *   loadAlphabetMeals('C') → Shows recipes starting with C (Chicken, Carbonara, etc.)
 */
async function loadAlphabetMeals(letter) {
    console.log(`Loading meals for letter: ${letter}`);
    try {
        mealsTitle.textContent = `🍽️ Recipes starting with ${letter}`;
        mealsGrid.innerHTML = '<div class="loading">🔍 Loading recipes starting with ' + letter + '...</div>';
        
        const response = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?f=${letter}`);
        const data = await response.json();
        console.log(`API response for ${letter}:`, data.meals?.length || 0, 'meals');
        
        if (data.meals && data.meals.length > 0) {
            mealsGrid.innerHTML = '';
            data.meals.forEach(recipe => {
                const card = createRecipeCard(recipe);
                mealsGrid.appendChild(card);
            });
            console.log(`Successfully loaded ${data.meals.length} recipes for letter ${letter}`);
        } else {
            mealsGrid.innerHTML = `
                <div class="error">
                    No recipes found starting with "${letter}". 
                    <br>Some letters like Q, X, Z have fewer recipes.
                    <br>Try another letter! 📝
                </div>
            `;
        }
    } catch (error) {
        console.error('Failed to load alphabet recipes for ' + letter + ':', error);
        mealsGrid.innerHTML = '<div class="error">Failed to load recipes. Check connection (F12 console) and try again.</div>';
    }
}

// ============================================
// MODAL POPUP - RECIPE DETAIL FUNCTIONS
// ============================================
/**
 * ADDED: Modal popup functionality for recipe details
 * FEATURES:
 *   - Click recipe card → modal opens with full recipe
 *   - Shows ingredients list, cooking instructions, video
 *   - Close on ESC key, outside click, or close button
 *   - Smooth loading animation while fetching from API
 */

// Track current recipe being displayed in modal
let currentRecipeId = null;

/**
 * showRecipe() - ADDED FUNCTION - FIXED POPUP FEATURE
 * Opens modal popup and starts loading recipe details
 * 
 * WHAT WAS BROKEN:
 *   ❌ Modal didn't open when clicking recipe cards
 *   ❌ Loading spinner didn't show
 *   ❌ Content didn't render in modal
 * 
 * HOW IT WORKS NOW:
 *   1. Sets currentRecipeId for tracking which recipe is open
 *   2. Gets modal element from DOM by ID 'recipeModal'
 *   3. Gets content container by ID 'modalRecipeContent'
 *   4. Shows modal with loading spinner animation
 *   5. Fetches full recipe data from TheMealDB API using recipe.idMeal
 *   6. Calls renderModalContent() to populate modal with recipe details
 *   7. Catches errors and shows friendly error message
 * 
 * FIX APPLIED: Now properly displays modal and shows loading state
 */
function showRecipe(recipe) {
    currentRecipeId = recipe.idMeal;
    const modal = document.getElementById('recipeModal');
    const contentEl = document.getElementById('modalRecipeContent');
    
    // FIX: Make sure modal exists before trying to show it
    if (!modal) {
        console.error('Modal element not found! Make sure #recipeModal exists in HTML');
        return;
    }
    
    // Show modal with loading state
    modal.style.display = 'block';
    contentEl.innerHTML = `
        <div style="text-align: center; padding: 40px 20px;">
            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;" id="modalTitle">${recipe.strMeal || 'Loading recipe...'}</div>
            <div id="modalSpinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto;"></div>
            <p style="color: #666; margin-top: 10px;">Fetching delicious details...</p>
        </div>
    `;
    
    // Fetch full recipe details from API
    fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${recipe.idMeal}`)
        .then(response => response.json())
        .then(data => {
            if (data.meals && data.meals[0]) {
                const fullRecipe = data.meals[0];
                console.log('Recipe loaded successfully:', fullRecipe.strMeal);
                renderModalContent(fullRecipe);
            } else {
                throw new Error('No recipe details found');
            }
        })
        .catch(error => {
            console.error('Error fetching recipe details:', error);
            contentEl.innerHTML = `
                <div style="text-align: center; padding: 30px 20px;">
                    <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; color: #e74c3c;">⚠️ Error Loading Recipe</div>
                    <p style="color: #666;">Unable to fetch recipe details. Please check your internet connection and try again.</p>
                    <button onclick="closeModal()" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px;">Close</button>
                </div>
            `;
        });
}

/**
 * closeModal() - ADDED FUNCTION - CLOSES POPUP
 * Closes the recipe detail modal popup
 * 
 * WHAT IT DOES:
 *   1. Hides modal by setting display: none (removes from view)
 *   2. Clears currentRecipeId to mark no recipe is open
 *   3. Allows user to see page behind modal again
 * 
 * TRIGGERED BY:
 *   - Click close button (×)
 *   - Press ESC key
 *   - Click outside modal
 */
function closeModal() {
    const modal = document.getElementById('recipeModal');
    if (modal) {
        modal.style.display = 'none';
    }
    currentRecipeId = null;
    console.log('Modal closed');
}

/**
 * renderModalContent() - ADDED FUNCTION
 * Populates modal with full recipe details from API
 * 
 * DISPLAYS:
 *   1. Recipe image and title
 *   2. Category and area (cuisine type)
 *   3. Complete ingredients list with measurements
 *   4. Step-by-step cooking instructions
 *   5. Embedded YouTube video (if available)
 * 
 * FIXED: Now properly clears loading spinner before rendering content
 */
function renderModalContent(recipe) {
    const contentEl = document.getElementById('modalRecipeContent');
    
    // FIX ADDED: Hide spinner and clear loading message
    const spinner = document.getElementById('modalSpinner');
    if (spinner) {
        spinner.style.display = 'none';
    }
    const titleEl = document.getElementById('modalTitle');
    if (titleEl) {
        titleEl.textContent = recipe.strMeal || 'Recipe';
    }
    
    // Extract ingredients and measurements
    let ingredients = [];
    for (let i = 1; i <= 20; i++) {
        const ingredient = recipe[`strIngredient${i}`];
        const measure = recipe[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
            ingredients.push(`${measure || ''} ${ingredient}`.trim());
        }
    }
    
    // Build ingredients HTML
    const ingredientsHTML = ingredients
        .map(ing => `<div class="ingredient-item">✓ ${ing}</div>`)
        .join('');
    
    // Split instructions into numbered steps
    const instructions = (recipe.strInstructions || '').split('.');
    const instructionsHTML = instructions
        .filter(step => step.trim())
        .map((step, idx) => `
            <div class="instruction-step">
                <strong>Step ${idx + 1}:</strong> ${step.trim()}
            </div>
        `)
        .join('');
    
    // Build video embed if YouTube URL exists
    // FIX ADDED: Properly extract YouTube video ID from URL
    let videoHTML = '';
    if (recipe.strYoutube) {
        try {
            let videoId = recipe.strYoutube;
            // Handle different YouTube URL formats
            if (recipe.strYoutube.includes('v=')) {
                videoId = recipe.strYoutube.split('v=')[1];
            } else if (recipe.strYoutube.includes('youtu.be/')) {
                videoId = recipe.strYoutube.split('youtu.be/')[1];
            }
            videoHTML = `
                <div class="modal-section">
                    <h4>📹 Watch Tutorial</h4>
                    <div class="video-container">
                        <iframe 
                            width="100%" 
                            height="315" 
                            src="https://www.youtube.com/embed/${videoId}" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            `;
        } catch (e) {
            console.warn('Failed to parse YouTube URL:', e);
        }
    }
    
    // Render complete modal content
    contentEl.innerHTML = `
        <div class="modal-body">
            <!-- Recipe Image -->
            <div style="margin-bottom: 20px; border-radius: 10px; overflow: hidden;">
                <img src="${recipe.strMealThumb || 'https://via.placeholder.com/300x200?text=🍳'}" 
                     style="width: 100%; height: 300px; object-fit: cover;" 
                     alt="${recipe.strMeal}"
                     onerror="this.src='https://via.placeholder.com/300x200?text=🍳'">
            
            <!-- Recipe Title & Info -->
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #333; margin-bottom: 10px;">${recipe.strMeal || 'Recipe'}</h2>
                <p style="color: #666; font-size: 1rem;">
                    ${recipe.strCategory ? '<span style="background: #667eea; color: white; padding: 5px 10px; border-radius: 20px; margin-right: 10px; display: inline-block;">' + recipe.strCategory + '</span>' : ''}
                    ${recipe.strArea ? '<span style="background: #f39c12; color: white; padding: 5px 10px; border-radius: 20px; display: inline-block;">' + recipe.strArea + '</span>' : ''}
                </p>
            </div>
            
            <!-- Ingredients Section -->
            <div class="modal-section">
                <h4>🥘 Ingredients</h4>
                ${ingredientsHTML}
            </div>
            
            <!-- Instructions Section -->
            <div class="modal-section">
                <h4>👨‍🍳 Cooking Instructions</h4>
                ${instructionsHTML}
            </div>
            
            <!-- Video Section -->
            ${videoHTML}
            
            <!-- Save Recipe Button -->
            <!-- FIXED: Removed inline onclick to avoid 'recipe not defined' error -->
            <!-- Now using safe data attributes instead -->
            <div style="text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px;">
                <button class="modal-save-btn" data-recipe-id="${recipe.idMeal}"
                        style="background: ${isSaved(recipe.idMeal) ? '#27ae60' : '#667eea'}; color: white; border: none; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-size: 1rem; transition: all 0.2s;">
                    ${isSaved(recipe.idMeal) ? '✓ Saved to Collection' : '💾 Save This Recipe'}
                </button>
            </div>
        </div>
    `;
}

// Initialize app
/**
 * PAGE INITIALIZATION
 * 
 * WHAT HAPPENS WHEN PAGE LOADS:
 *   1. Waits for DOM to be fully loaded (all HTML parsed)
 *   2. Calls loadLatestRecipes() to load popular recipes
 *   3. Sets up event listener for save buttons (both recipe cards and modal)
 *   4. Page is ready for user interaction
 * 
 * FIXES APPLIED:
 *   ✅ Save buttons now use data attributes instead of inline onclick
 *   ✅ Prevents "recipe not defined" error
 *   ✅ Properly handles click events on dynamically created elements
 *   ✅ Uses event delegation for reliable event handling
 */
document.addEventListener('DOMContentLoaded', () => {
    console.log('Page loaded, initializing recipe app...');
    loadLatestRecipes();
    
    // FIXED: Add event listener for ALL save buttons
    // Handles both recipe card save buttons AND modal save buttons
    // Uses event delegation to work with dynamically created elements
    document.addEventListener('click', (e) => {
        // Check if clicked element has save-btn class OR modal-save-btn class
        if (e.target.classList.contains('save-btn') || e.target.classList.contains('modal-save-btn')) {
            // Get recipe ID from data attribute
            const button = e.target.closest('.save-btn, .modal-save-btn');
            if (button) {
                const recipeId = button.getAttribute('data-recipe-id');
                if (recipeId) {
                    toggleSave(recipeId, e);
                }
            }
        }
    });
});
</script>
