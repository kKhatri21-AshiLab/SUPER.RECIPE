<!-- 
  ============================================
  LANDING PAGE - indexMain.html - BEGINNER GUIDE
  ============================================
  FILE PURPOSE: Home page with ingredient tag search system
  
  WHAT THIS PAGE DOES:
    1. Hero background image with "Supercook" branding
    2. Interactive ingredient tag creator 
    3. Sticky navigation header
    4. Responsive mobile-first design
  
  KEY FEATURES:
    - Type ingredient → click Add → tag appears instantly
    - Form submit OR button click both work
    - Hover animations on Add button
    - Flexbox for perfect centering
  
  LEARNING POINTS:
    - CSS Sticky positioning
    - Background images & hero sections
    - JavaScript DOM manipulation (createElement)
    - Event listeners (submit + click)
    - Array storage (tags[])
  ============================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- UTF-8: Supports all characters/emojis worldwide -->
    <meta charset="UTF-8">
    <!-- Mobile responsive: Scales perfectly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser tab title + SEO -->
    <title>SuperCook - Home & Ingredient Search</title>

<style>
        /* 
         ============ CSS RESET (APPLIES TO ALL ELEMENTS) ============
         box-sizing: border-box = padding/borders INCLUDED in width
         margin/padding: 0 = remove browser defaults
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* BODY: Main page styling */
        body {
            /* Typography: Font + line spacing */
            font-family: Arial, sans-serif;
            line-height: 1.6;
            /* Light cyan background */
            background-color: #95ebeb;
        }

        /* HEADER: Navigation - STAYS AT TOP when scrolling */
        header {
            /* Dark navy (#04072b) background */
            background-color: #04072b;
            /* Pink text */
            color: #f7b2f3;
            padding: 1em;
            text-align: center;
            border-bottom: 1px solid #444;
            /* STICKY MAGIC: Sticks to top */
            position: sticky;
            top: 0;
        }

header h2{
    text-align: left;
    margin-bottom: 20px;
}

header nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: space-between;
    text-size-adjust: 20px;
}

header nav li {
    margin-right: 20px;
}

header nav a {
    color: #fff;
    text-decoration: none;
}

main {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hero {
    background-image: url('./img/First.jpg');
    height: 800px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    background-repeat: no-repeat;
}

.hero-inner {
    justify-content: center;
    align-items: center;
}

#search-form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#search-input {
    padding: 10px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    width: 250px;
}

#add-button {
    background-color: #333;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

#add-button:hover{
    background-color: #e78484;
    color: blue;
    font-size: 20px;
    border-radius: 10px;
}

#search-feed {
    margin-top: 20px;
}

.tag {
    background-color: #333;
    color: #fff;
    padding: 5px 10px;
    border-radius: 5px;
    margin: 5px;
    display: inline-block;
}

footer {
    color: #04072b; 
}
</style>

   
</head>
<body>
    <header>
        <nav>
            <h2>Welcome Super Cook Book</h2>
            <ul>
<li><a href="./mainHTML/indexMain2.html">Recipes</a></li>
                <li><a href="#">Cookbooks</a></li>
                <li><a href="#">Meal Planner</a></li>
                <li><a href="#">add Grocery List</a></li>
                <li><a href="#">pdf's</a></li>
                <li><a href="#">posts</a></li>
                <li><a href="#">feeds </a></li>
                <li><a href="./mainHTML/addRecipe.html">Add Recipe</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero-inner">
                <h1>Supercook</h1>
                <p>Find recipes based on ingredients you already have!</p>
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="Enter ingredients...">
                    <button id="add-button">Add</button>
                    <div id="search-feed"></div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Supercook</p>
    </footer>

    <script>
const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const addButton = document.getElementById('add-button');
const searchFeed = document.getElementById('search-feed');

let tags = [];

searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.textContent = inputValue;
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
    }
});

addButton.addEventListener('click', () => {
    const inputValue = searchInput.value.trim();
    if (inputValue) {
        const tag = document.createElement('span');
        tag.classList.add('tag');
        tag.textContent = inputValue;
        searchFeed.appendChild(tag);
        tags.push(inputValue);
        searchInput.value = '';
    }
});
    </script>
</body>

</html>
