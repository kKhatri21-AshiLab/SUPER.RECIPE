    <style>
/* From Uiverse.io by gohar_7145 - Navigation */
.outline {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.rect {
  stroke-dashoffset: 5;
  stroke-dasharray: 0 0 10 40 10 40;
  transition: 0.5s;
  stroke: #e4ae0b;
}

.nav {
  position: relative;
  width: clamp(450px, 65vw, 650px);
  height: 60px;
  border-radius: 40px;
}

.container:hover .outline .rect {
  transition: 999999s;
  stroke-dashoffset: 1;
  stroke-dasharray: 0;
}

.container {
  position: absolute;
  inset: 0;
  background: rgba(16, 16, 16, 0.9);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  align-items: center;
  padding: 0.5em;
  border-radius: 40px;
}

.btn {
  padding: 0.5em 1.5em;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
  border-radius: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.btn:hover {
  background: #e4ae0b;
  color: #000;
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(228, 174, 11, 0.4);
}

.btn:nth-child(1):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 2 8 73.3 8 10.7;
}

.btn:nth-child(2):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 12.6 9.5 49.3 9.5 31.6;
}

.btn:nth-child(3):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 24.5 8.5 27.5 8.5 55.5;
}

.btn:nth-child(4):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 34.7 6.9 10.2 6.9 76;
}

.btn:nth-child(5):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 44 6 5 6 65;
}

.btn:nth-child(6):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 50 5 3 5 52;
}

.btn:nth-child(7):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 57 4.5 1.5 4.5 47;
}

.btn:nth-child(8):hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 62 4 0 4 44;
}

.btn:hover ~ svg .rect {
  stroke-dashoffset: 0;
  stroke-dasharray: 0 0 10 40 10 40;
  transition: 0.5s !important;
}

@media (max-width: 768px) {
  .nav {
    width: clamp(350px, 75vw, 450px);
    height: 50px;
  }
  .container {
    padding: 0.3em;
  }
  .btn {
    padding: 0.4em 0.8em;
    font-size: 0.85rem;
  }
}
    </style>

    <style>
        /* 
         =========== CSS RESET - Removes browser defaults ===========
         Applies to ALL elements (*) on page
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Padding/border INCLUDED in width */
        }

        /* BODY: Purple gradient + perfect centering */
        body {
            /* Modern font stack (Segoe UI first, fallbacks) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* GRADIENT BACKGROUND: Purple to dark purple */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* Full screen height */
            min-height: 100vh;
            /* FLEXBOX CENTER: Perfect horizontal/vertical centering */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .back-btn i {
            margin-right: 8px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 18px;
        }

        .show-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: #667eea;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #5a67d8;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: #999;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e5e9;
            z-index: 1;
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            text-decoration: none;
        }

        .social-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-1px);
        }

        .social-btn i {
            margin-right: 8px;
            font-size: 18px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
                margin: 10px;
            }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: none;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
            display: none;
        }

<body>
    <!-- SUPER.RECIPE NAVIGATION - Fixed top-right across all pages -->
    <header style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
      <div class="nav">
        <div class="container">
          <div class="btn" onclick="window.location.href='indexMain.html'">Home</div>
          <div class="btn" onclick="window.location.href='LOGIN PAGE.HTML'">Join</div>
          <div class="btn" onclick="window.location.href='ADD RECIPE PAGE.HTML'">Add Recipe</div>
          <div class="btn" onclick="window.location.href='INDEX.HTML'">Index</div>
          <div class="btn" onclick="window.location.href='SEARCHING RECIPE FROM MEAL DP.html'">Search</div>
          <div class="btn" onclick="alert('Contact feature coming soon!')">Contact</div>\n          <div class="btn" onclick="alert('About feature coming soon!')">About</div>\n          <svg\n
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 400 60"\n            height="60"\n            width="400"
            overflow="visible"
            class="outline"
          >
            <rect
              stroke-width="5"
              fill="transparent"
              height="60"
              width="650"
              y="0"
              x="0"
              pathLength="100"
              class="rect"
            ></rect>
          </svg>
        </div>
      </div>
    </header>
    <a href="RECEPE CARD.HTML" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Recipes
    </a>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please sign in to your account</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class="fas fa-eye show-password" id="togglePassword"></i>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-login">
            <a href="#" class="social-btn">
                <i class="fab fa-google"></i> Google
            </a>
            <a href="#" class="social-btn">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>

        <div class="register-link">
            Don't have an account? <a href="#">Sign up here</a>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Form validation and submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // Hide previous messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Basic validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            // Simulate API call
            setTimeout(() => {
                // Demo credentials: email: demo@test.com, password: 123456
                if (email === 'demo@test.com' && password === '123456') {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        alert('Welcome to Dashboard!');
                        // window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showError('Invalid email or password');
                }
            }, 1000);
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
        }
    </script>
</body>
